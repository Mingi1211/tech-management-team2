<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.shot{background:#0E1327;padding:0;overflow:hidden;display:inline-block;vertical-align:top}
/* ---------- phone app ---------- */
.app{width:420px;height:860px;background:#0E1327;color:#fff;padding:26px 22px;display:flex;flex-direction:column;gap:16px}
.app .top{display:flex;justify-content:space-between;align-items:center}
.term{font-size:15px;color:#8E97C4;font-weight:500}
.logo{font-size:17px;font-weight:800;letter-spacing:-.4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#1E2542;border:1px solid #2F3862;border-radius:999px;padding:6px 11px;font-size:12.5px;color:#C7CDEC}
.chip.hot{background:#3A1E2B;border-color:#7A2C3C;color:#FF9AA0}
.hero{background:#1A2140;border-radius:22px;padding:20px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.bubble{background:#fff;color:#12172B;font-size:16px;font-weight:800;padding:9px 16px;border-radius:14px;position:relative}
.bubble:after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.lvl{display:flex;align-items:center;gap:8px;margin-top:2px}
.lvdot{width:9px;height:9px;border-radius:50%}
.lvname{font-size:22px;font-weight:900;letter-spacing:-.6px}
.lvsub{font-size:12.5px;color:#8E97C4}
.card{background:#1A2140;border-radius:20px;padding:17px 18px}
.card h4{font-size:13px;color:#8E97C4;font-weight:600;margin-bottom:12px}
/* timeline */
.tl{display:flex;align-items:flex-end;gap:4px;height:104px}
.tl .b{flex:1;border-radius:4px 4px 2px 2px;position:relative}
.tlx{display:flex;gap:4px;margin-top:7px}
.tlx span{flex:1;text-align:center;font-size:9px;color:#5D6796}
.peak{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10px;color:#FF5A5F;font-weight:800;white-space:nowrap}
/* suggestion */
.sug{background:#20284C;border:1.5px solid #3D4A86;border-radius:18px;padding:16px 17px}
.sug .q{font-size:15px;font-weight:800;margin-bottom:12px;letter-spacing:-.3px}
.sugrow{display:flex;align-items:center;justify-content:space-between;background:#141B36;border-radius:13px;padding:11px 13px}
.sugrow .nm{font-size:14px;font-weight:700}
.sugrow .dt{font-size:11px;color:#8E97C4;margin-top:3px}
.btn{background:#FF5A5F;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:800;white-space:nowrap}
.dropto{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:12px;color:#8E97C4}
.pill{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
/* week detail */
.wk{display:flex;flex-direction:column;gap:9px}
.wkrow{display:flex;gap:11px;align-items:flex-start;background:#141B36;border-radius:13px;padding:12px 13px}
.ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.wkrow .t{font-size:13.5px;font-weight:700;line-height:1.35}
.wkrow .s{font-size:11.5px;color:#8E97C4;margin-top:3px}
.conf{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:800;flex:none}
/* ---------- wide panels ---------- */
.wide{width:1240px;background:#fff;padding:0}
.ba{display:flex;align-items:stretch;gap:0;width:1240px;background:#F4F6FB}
.bacol{flex:1;padding:34px 36px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bacol.l{background:#FFF1F1}
.bacol.r{background:#EFFAF6}
.baarrow{width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:#fff}
.baarrow .ar{font-size:36px;color:#3D4A86}
.baarrow .lab{font-size:14px;font-weight:800;color:#12172B;text-align:center;line-height:1.4}
.batag{font-size:13px;font-weight:800;color:#6A73A0;letter-spacing:.6px}
.baname{font-size:30px;font-weight:900;letter-spacing:-.8px;color:#12172B}
.tlw{display:flex;align-items:flex-end;gap:5px;height:118px;width:100%}
.tlw .b{flex:1;border-radius:5px 5px 2px 2px}
/* character sheet */
.sheet{display:flex;width:1240px;background:#fff}
.scol{flex:1;padding:26px 10px 22px;display:flex;flex-direction:column;align-items:center;gap:9px;border-right:1px solid #E7EAF4}
.scol:last-child{border-right:0}
.sname{font-size:19px;font-weight:900;color:#12172B;letter-spacing:-.5px}
.sline{font-size:13px;color:#6A73A0;text-align:center;line-height:1.45;min-height:38px;padding:0 6px}
.sbar{width:54px;height:6px;border-radius:3px}
/* gif frames */
.gif{display:flex;width:1180px;background:#fff;align-items:center;justify-content:center;gap:0;padding:18px 0}
.gcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px}
.gcap{font-size:14px;color:#6A73A0;font-weight:700}
.garrow{font-size:28px;color:#C3C9E0}
/* share card */
.share{width:520px;height:650px;background:linear-gradient(170deg,#1A2140 0%,#0E1327 100%);color:#fff;padding:36px 32px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.share .hd{font-size:15px;color:#8E97C4;font-weight:700;letter-spacing:.5px}
.share .ty{font-size:34px;font-weight:900;letter-spacing:-1px;text-align:center;line-height:1.25}
.share .qt{font-size:17px;color:#FFD1D3;font-weight:700;text-align:center}
.share .ft{font-size:13px;color:#6A73A0;font-weight:600}
.share .warn{background:#2A1C33;border-radius:12px;padding:10px 18px;font-size:13.5px;color:#FFB3B6;font-weight:700}
/* engine diagram */
.eng{width:1240px;background:#fff;padding:30px 34px;display:flex;align-items:center;gap:0}
.ebox{flex:1;border-radius:18px;padding:20px 20px;background:#F4F6FB}
.ebox.hidden{background:#EDEFF7;border:2px dashed #AAB2D4}
.ebox h5{font-size:12.5px;font-weight:800;color:#6A73A0;letter-spacing:.8px;margin-bottom:12px}
.erow{display:flex;justify-content:space-between;font-size:14px;color:#12172B;padding:6px 0;font-weight:600}
.erow b{font-weight:900;color:#FF5A5F}
.etot{display:flex;justify-content:space-between;font-size:16px;font-weight:900;color:#12172B;border-top:2px solid #D9DEEF;margin-top:8px;padding-top:9px}
.earr{width:74px;text-align:center;font-size:30px;color:#AAB2D4}
.eyes{font-size:14px;color:#12172B;font-weight:600;line-height:1.7}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:4px 9px;border-radius:6px;margin-bottom:9px}
</style></head><body>
<div id="root"></div>
<script>
const C={1:"#4ECDC4",2:"#8FD96B",3:"#FFD93D",4:"#FF9F45",5:"#FF5A5F"};

}

}
